  changelog_file: null

gaps:
- >-
  No API changelog at all. A consumer cannot learn what changed between contract 1.0.0
  and 1.1.0.
- >-
  Only one of four SDKs (Python) ships a CHANGELOG.md; the Node SDK went to 2.0.0 with no
  documented migration note.
